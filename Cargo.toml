[workspace]
resolver = "2"
members = [
    "crates/bluetooth-numbers",
    "crates/bluetooth-adv",
    "crates/bluetooth-host",
    "crates/bluetooth-bridge",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/pulzar-net/bluetooth-bridge"
authors = ["Pulzar LLC"]

[workspace.dependencies]
bluetooth-numbers = { path = "crates/bluetooth-numbers", version = "0.1.0" }
bluetooth-adv = { path = "crates/bluetooth-adv", version = "0.1.0" }
bluetooth-host = { path = "crates/bluetooth-host", version = "0.1.0" }

aes = "0.9"
bt-hci = "0.11"
bt-hci-linux = "0.2"
ccm = { version = "0.6", default-features = false, features = ["alloc"] }
cmac = "0.8"
getrandom = "0.4"
hex = "0.4"
p256 = { version = "0.14", features = ["ecdh"] }
ruuvi-sensor-protocol = { version = "0.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-serial = { version = "5.5", default-features = false }
toml = "1.2"
tracing = "0.1"
yaml-rust2 = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
