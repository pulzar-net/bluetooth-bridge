[workspace]
resolver = "2"
members = [
    "crates/bluetooth-numbers",
    "crates/bluetooth-adv",
    "crates/bluetooth-host",
    "crates/bluetooth-mesh-stack",
    "crates/bluetooth-bridge",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/pulzar-net/bluetooth-bridge"
homepage = "https://oss.pulzr.net/bluetooth-bridge/"
authors = ["Pulzar LLC"]

[workspace.dependencies]
bluetooth-numbers = { path = "crates/bluetooth-numbers", version = "0.2.0" }
bluetooth-adv = { path = "crates/bluetooth-adv", version = "0.2.0" }
bluetooth-host = { path = "crates/bluetooth-host", version = "0.2.0" }
bluetooth-mesh-stack = { path = "crates/bluetooth-mesh-stack", version = "0.2.0" }

aes = "0.9"
bt-hci = "0.11"
bt-hci-linux = "0.2"
ccm = { version = "0.6", default-features = false, features = ["alloc"] }
cmac = "0.8"
getrandom = "0.4"
hex = "0.4"
p256 = { version = "0.14", features = ["ecdh"] }
ruuvi-sensor-protocol = { version = "0.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-serial = { version = "5.5", default-features = false }
toml = "1.2"
tracing = "0.1"
yaml-rust2 = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The bridge crate is MQTT glue: its code is mostly serde for the MQTT API's
# types (src/api.rs), generic code instantiated here, while the radio path
# runs in bluetooth-host. Built for size, it keeps the static binary under
# the gateways' budget (MAX_BINARY_SIZE in ci.yml).
[profile.release.package.bluetooth-bridge]
opt-level = "z"

# The MQTT reference (crates/bluetooth-bridge/tests/asyncapi.rs, feature
# unstable-asyncapi-docs) needs what no asyncapi-rust release has yet:
# channel and operation messages (upstream main, mlilback/asyncapi-rust#17),
# and channel and operation descriptions, titles and summaries (our fork,
# offered upstream). Pinned to pulzar-net/asyncapi-rust, which is never
# published. Default and release builds never use asyncapi-rust, and
# `cargo publish` ignores this patch. Remove it once a release has all three.
[patch.crates-io]
asyncapi-rust = { git = "https://github.com/pulzar-net/asyncapi-rust", rev = "d62a75517859cc031a3f716df86e64d6406040d1" }
asyncapi-rust-codegen = { git = "https://github.com/pulzar-net/asyncapi-rust", rev = "d62a75517859cc031a3f716df86e64d6406040d1" }
asyncapi-rust-models = { git = "https://github.com/pulzar-net/asyncapi-rust", rev = "d62a75517859cc031a3f716df86e64d6406040d1" }
