[package]
name = "bluetooth-bridge"
description = "A standalone Bluetooth LE to MQTT bridge with Home Assistant discovery, on the bluetooth-host stack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/bluetooth-bridge"
readme = "README.md"
# Tests run from the repository (Bumble, recordings, the example config); the package is the library.
include = ["src/**", "README.md", "LICENSE"]
keywords = ["bluetooth", "ble", "mqtt", "home-assistant", "bthome"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "bluetooth-bridge"
path = "src/main.rs"

[features]
## Derive a JSON Schema for the configuration, from which the docs' configuration
## reference is generated (tests/config_reference.rs).
schema = ["dep:schemars", "bluetooth-host/schema"]
## Docs tooling, not API: derive JSON Schemas and AsyncAPI messages for the MQTT
## payloads (src/api.rs), from which the docs' MQTT reference is generated
## (tests/asyncapi.rs). It may change in any release; default builds, release
## binaries and cross builds never turn it on.
unstable-asyncapi-docs = ["dep:schemars", "dep:asyncapi-rust", "bluetooth-host/schema", "bluetooth-adv/schema"]

[dependencies]
schemars = { version = "1", optional = true, features = ["preserve_order"] }
asyncapi-rust = { version = "0.5", optional = true }
bluetooth-adv.workspace = true
bluetooth-host.workspace = true
bluetooth-mesh-stack.workspace = true
bluetooth-numbers.workspace = true
hex.workspace = true
lexopt = "0.3"
rumqttc = { version = "0.25", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }

[dev-dependencies]
rumqttd = { version = "0.20", default-features = false }
tempfile = "3"
tokio = { workspace = true, features = ["process", "io-util", "rt-multi-thread", "macros", "time", "sync"] }

[[test]]
name = "config_reference"
required-features = ["schema"]

[[test]]
name = "asyncapi"
required-features = ["unstable-asyncapi-docs"]

[lints]
workspace = true
