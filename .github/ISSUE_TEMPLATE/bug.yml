name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Search [open issues](https://github.com/pulzar-net/bluetooth-bridge/issues) first, and read [Troubleshooting](https://oss.pulzr.net/bluetooth-bridge/troubleshooting.html).
        **Security problems:** do not file them here. [Report them privately](https://github.com/pulzar-net/bluetooth-bridge/security/advisories/new).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest set of steps. Does it happen with the simulator too?
      placeholder: |
        1. Start the bridge with the configuration below
        2. Publish ... to ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `bluetooth-bridge --version`, or the commit if built from source.
      placeholder: "bluetooth-bridge 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: use
    attributes:
      label: How you use it
      options:
        - The bridge (release binary)
        - The bridge (built from source)
        - The crates as a library
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Controller and devices
      description: The controller and transport (`hci0`, `serial:...`), with the output of `bluetooth-bridge probe TRANSPORT`, and the devices involved (manufacturer, model, firmware).
      placeholder: "TP-Link UB500 on hci0 (RTL8761BU); Shelly BLU H&T"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, architecture and board.
      placeholder: Debian 13 on a Raspberry Pi 4 (aarch64)
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your configuration file, with passwords removed.
      render: toml
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run with `RUST_LOG=debug` and paste the relevant part. Check it for anything you consider private first.
      render: text
