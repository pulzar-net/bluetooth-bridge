# Static musl binaries of the bridge, on a tag.
#
#   aarch64-unknown-linux-musl   Raspberry Pi 3, 4 and 5 class boards
#   mipsel-unknown-linux-musl    MT7621/MT7628 class routers
#   x86_64-unknown-linux-musl    PCs and servers
#
# No big-endian targets: bt-hci, which encodes the HCI packets, supports
# little-endian machines only (it checks at compile time).
#
# The tag must equal the workspace version. Every target's tests run under
# qemu before anything is published; the release carries the binaries and
# SHA256SUMS. Then the crates go to crates.io, in dependency order.

name: release
on:
  push:
    tags: ['v*']
  # Builds an existing tag again (when a release failed for a reason
  # outside the tagged code).
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build and release
        required: true

permissions:
  contents: read

env:
  NIGHTLY: nightly-2026-11-14
  ZIG: 0.16.0
  ZIGBUILD: 0.24.1
  MAX_BINARY_SIZE: 3145728

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          ref: ${{ inputs.tag || github.ref }}

      - name: The tag is the crate version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          want="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          [ "${TAG#v}" = "${want}" ] || { echo "tag ${TAG} is not v${want}" >&2; exit 1; }

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rust-src
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@${{ env.ZIGBUILD }}
      - name: qemu-user
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-user

      - name: Test and build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUNNER: qemu-aarch64
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_RUNNER: qemu-mipsel
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=no
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUNNER: env
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl mipsel-unknown-linux-musl; do
            echo "::group::${target}"
            std=()
            case "${target}" in mips*) std=(-Zbuild-std) ;; esac
            cargo-zigbuild test --workspace --target "${target}" "${std[@]}"
            case "${target}" in mips*) std=(-Zbuild-std=std,panic_abort) ;; esac
            cargo zigbuild --release --bin bluetooth-bridge --target "${target}" "${std[@]}"
            bin="target/${target}/release/bluetooth-bridge"
            file "${bin}" | grep -q 'statically linked' || { file "${bin}"; echo "${target}: not static" >&2; exit 1; }
            size="$(stat -c %s "${bin}")"
            echo "${target}: ${size} bytes"
            [ "${size}" -le "${MAX_BINARY_SIZE}" ] || { echo "over the ${MAX_BINARY_SIZE} byte budget" >&2; exit 1; }
            runner="CARGO_TARGET_$(echo "${target}" | tr 'a-z-' 'A-Z_')_RUNNER"
            "${!runner}" "${bin}" --version
            cp "${bin}" "dist/bluetooth-bridge-${target%%-*}-linux-musl"
            echo "::endgroup::"
          done
          (cd dist && sha256sum bluetooth-bridge-* > SHA256SUMS && cat SHA256SUMS)

      - name: Release notes from the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # The annotated tag's message (git tag -a vX.Y.Z --cleanup=whitespace
          # -F notes.md), else GitHub's generated notes; never none.
          set -euo pipefail
          notes="${RUNNER_TEMP}/notes.md"
          git fetch -q --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          : > "${notes}"
          if [ "$(git cat-file -t "refs/tags/${TAG}")" = tag ]; then
            git cat-file tag "refs/tags/${TAG}" | sed '1,/^$/d; /^-----BEGIN [A-Z ]*SIGNATURE-----$/,$d' > "${notes}"
          fi
          if ! awk -v t="${TAG}" 'NF && $0 != t { f = 1 } END { exit !f }' "${notes}"; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG}" -q .body > "${notes}"
            awk 'NF && !/Full Changelog/ { f = 1 } END { exit !f }' "${notes}" || {
              echo "::error::${TAG} has no release notes: tag it with git tag -a and the notes as its message"; exit 1; }
          fi
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "${TAG}" dist/* --title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md" --verify-tag

  # The crates, after the binaries are out: each in dependency order, a
  # version crates.io already has skipped, so a release run again after a
  # failure part way finishes the rest. Authenticated with the
  # CARGO_REGISTRY_TOKEN secret, or by trusted publishing (OIDC) once the
  # crates are set up for it on crates.io and the TRUSTED_PUBLISHING variable
  # is "true".
  crates:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      CRATES: bluetooth-numbers bluetooth-adv bluetooth-host bluetooth-mesh-stack bluetooth-bridge
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Trusted publishing token
        id: oidc
        if: vars.TRUSTED_PUBLISHING == 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.oidc.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Until a token or trusted publishing is set up, a release is the
          # binaries alone.
          [ -n "${CARGO_REGISTRY_TOKEN}" ] || { echo "no crates.io token; the crates are not published"; exit 0; }
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          for crate in ${CRATES}; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -A 'bluetooth-bridge release (github.com/pulzar-net/bluetooth-bridge)' \
              "https://crates.io/api/v1/crates/${crate}/${version}")"
            if [ "${code}" = 200 ]; then echo "${crate} ${version} is already on crates.io"; continue; fi
            cargo publish -p "${crate}" --locked
          done
